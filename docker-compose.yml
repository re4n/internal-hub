services:
  db:
    image: mysql:8.0
    container_name: internal_hub_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/resources/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: always
    networks:
      - internal-hub-net

  api:
    build: .
    container_name: internal_hub_api
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:mysql://db:3306/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - db
    restart: always
    networks:
      - internal-hub-net

volumes:
  mysql_data:

networks:
  internal-hub-net:
    driver: bridge